<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Banner -->
    <header class="hero">
        <img src="https://plus.unsplash.com/premium_photo-1675367606982-2a211004b593?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8Z2hhbmElMjBjdWx0dXJlfGVufDB8fDB8fHww" alt="Banner">

        <div class="hero-text">
            <h1>Akan Name Generator</h1>

            <p>
                Discover your Akan name based on the day you were born.
                Enter your birth date and gender to generate your Akan name.
            </p>
        </div>
    </header>

    <!-- Main Section -->
    <section class="container">

        <div class="form-box">

            <h2>When were you born?</h2>

<form onsubmit="generateAkanName(event)">

    <label>Date</label>
<input
    type="number"
    id="day"
    placeholder="24"
    min="1"
    max="31"
    required>

<label>Month</label>
<input
    type="number"
    id="month"
    placeholder="7"
    min="1"
    max="12"
    required>

<label>Year</label>
<input
    type="number"
    id="year"
    placeholder="2002"
    min="1900"
    max="2026"
    required>

    <label>Gender</label>

    <div class="gender">
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
    </div>

    <button type="submit"id="GenerateBtn">Generate Akan name</button>

    <p id="result"></p>

</form>
        </div>

        <div class="image-box">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQhWjt9iA615_5QyrK8_q19ZoQObulN8I6j0zbGYETcjQ&s=10" alt="Ghana Culture">
        </div>

    </section>
<script src="script.js"></script>
</body>
</html>
